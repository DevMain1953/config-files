bind shift "+duck_and_jump"
alias +duck_and_jump "+duck;+jump"
alias -duck_and_jump "-duck;-jump"

alias +ctap "bind mouse1 +jump_and_shoot; +duck"
alias -ctap "-duck; -attack"
alias +jump_and_shoot "-duck; +jump; +attack"
alias -jump_and_shoot "-jump; -attack; bind mouse1 +attack"
bind mouse2 +ctap

alias +power_bounce "+attack; +jump; +duck"
alias -power_bounce "-attack; -jump; -duck"
bind c +power_bounce

bind ctrl "+default_duck"
alias +default_duck "+duck"
alias -default_duck "-duck"

alias jumpbug "+duck; bind space +jumpbugjump"
bind x jumpbug
alias +jumpbugjump "-duck; +jump"
alias -jumpbugjump "-jump; bind space +jump"

m_rawinput 1
m_customaccel 0
m_mouseaccel1 0
m_mouseaccel2 0
m_mousespeed 0
m_filter 0
sensitivity 2.2
zoom_sensitivity_ratio 1.0

bind "MOUSE3" "toggle sensitivity 3.2 2.2"
